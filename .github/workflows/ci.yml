name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # prisma generate runs in postinstall and requires a URL string (no live DB)
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          CI: true
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Build web app
        run: npm run build
        env:
          CI: true
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-secret-for-build-only
          AUTH_URL: http://localhost:3000
          AUTH_GITHUB_ID: ci
          AUTH_GITHUB_SECRET: ci
          AUTH_GOOGLE_ID: ci
          AUTH_GOOGLE_SECRET: ci

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: price_monitor
          POSTGRES_PASSWORD: price_monitor
          POSTGRES_DB: price_monitor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U price_monitor -d price_monitor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://price_monitor:price_monitor@localhost:5432/price_monitor_test
      TEST_DATABASE_URL: postgresql://price_monitor:price_monitor@localhost:5432/price_monitor_test
      TEST_REDIS_URL: redis://localhost:6379/2

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests (Postgres + Redis, mock marketplace)
        run: npm run test:integration
