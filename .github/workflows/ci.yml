name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # prisma generate runs in postinstall and requires a URL string (no live DB)
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Run tests
        run: npm test
        env:
          CI: true
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
